<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Пульт — Камер Аудио Студио</title>
<style>body{margin:0;background:#10151e;color:#e5eaf3;font:16px 'Segoe UI',sans-serif}main{max-width:960px;margin:auto;padding:24px}h1{font-size:26px}img{width:100%;aspect-ratio:16/9;object-fit:contain;background:#090d14;border-radius:12px}section{background:#1b2331;padding:18px;margin-top:16px;border-radius:12px}button,a{font:inherit;color:inherit}button{background:#2d4264;border:1px solid #526680;padding:12px 18px;border-radius:8px;margin:4px;cursor:pointer}button:hover{background:#385886}p{color:#b5c1d4}#status{min-height:24px}a{color:#8bb8ff}</style>
<main><h1>Камер Аудио Студио · Пульт</h1><p id="status" role="status">Подключение…</p><img id="preview" alt="Превью студии"><section><h2>Сцены</h2><div id="scenes"></div></section><section><h2>Запись и звук</h2><button id="record">Начать запись</button><div id="channels"></div><div id="sounds"></div></section><p><a id="guest">Подключить камеру телефона или гостя</a></p><p>Ссылка содержит секретный токен. Передавай её только тем, кому разрешено управлять студией. Пульт работает, пока включён сервер.</p></main>
<script>
const token=new URLSearchParams(location.search).get('token');let state={};let pending=false;
const endpoint=p=>p+'?token='+encodeURIComponent(token||'');document.querySelector('#guest').href=endpoint('/guest');
async function command(type,target,value){try{const body={type};if(target!==undefined)body.target=target;if(value!==undefined)body.value=value;const r=await fetch(endpoint('/control'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw Error(await r.text());await refresh()}catch(e){document.querySelector('#status').textContent=e.message}}
function buttons(selector,items,onClick){const node=document.querySelector(selector);node.replaceChildren();for(const item of items){const b=document.createElement('button');b.textContent=item.name||item.id;b.onclick=()=>onClick(item);node.append(b)}}
async function refresh(){if(pending)return;pending=true;try{const r=await fetch(endpoint('/state'));if(!r.ok)throw Error('Нет доступа: проверь токен и состояние сервера');state=await r.json();buttons('#scenes',state.scenes||[],s=>command('scene',s.id));const channels=state.channels||[];buttons('#channels',channels.map(c=>({...c,name:(c.muted?'Включить: ':'Выключить: ')+(c.name||c.id)})),c=>command('mute',c.id,!c.muted));buttons('#sounds',state.sounds||[],s=>command('sound',s.id));document.querySelector('#record').textContent=state.recording?'Остановить запись':'Начать запись';document.querySelector('#status').textContent='Подключено · гостей: '+(state.guests||[]).length;document.querySelector('#preview').src=endpoint('/frame')+'&t='+Date.now()}catch(e){document.querySelector('#status').textContent=e.message}finally{pending=false}}
document.querySelector('#record').onclick=()=>command('record',undefined,!state.recording);refresh();setInterval(refresh,1000);
</script></html>
